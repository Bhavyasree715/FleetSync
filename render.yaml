# Render Infrastructure-as-Code Blueprint
# Deploy both Backend and Frontend on Render Cloud

services:
  # Option 1: Unified Full-Stack Web Service (Runs both Frontend + Backend + WebSockets on 1 Free Instance)
  - type: web
    name: fleetsync
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: VAPID_PUBLIC_KEY
        value: BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U
      - key: VAPID_PRIVATE_KEY
        value: UUx0EXAMPLE_VAPID_PRIVATE_KEY_FLEETSYNC
